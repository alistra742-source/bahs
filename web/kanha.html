<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghaith</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#151a24;--line:#283142;--text:#eef2f8;--muted:#8995aa;--accent:#9fe870}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% -20%,#263b36 0%,transparent 65%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}
main{width:min(760px,100%);min-height:100vh;margin:auto;padding:clamp(28px,8vh,86px) 18px 24px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{flex:1;margin:0 0 18px;font-size:clamp(32px,7vw,58px);font-weight:600;letter-spacing:-.06em;text-align:center}
.top-button{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}.top-button:hover{border-color:var(--accent)}
.mode{display:block;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px;font:inherit;outline:none}
#conversation{flex:1;display:flex;flex-direction:column;gap:16px;padding:12px 0 28px;overflow:auto}.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center}
.message{max-width:92%;padding:13px 16px;border:1px solid var(--line);border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.message.you{align-self:flex-end;background:#1d2c3e;border-color:#36516d}.message.kanha{align-self:flex-start;background:var(--panel)}
.code-block{margin:10px 0 0;border:1px solid #39465a;border-radius:11px;overflow:hidden;background:#0b0f16}.code-block code{display:block;padding:13px;overflow:auto;white-space:pre;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.copy-code{display:block;width:100%;padding:8px 12px;border:0;border-top:1px solid #39465a;background:#1d2634;color:var(--text);font:12px inherit;text-align:right;cursor:pointer}.copy-code:hover{color:var(--accent)}
.composer{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--bg) 18%)}textarea{flex:1;min-height:54px;max-height:180px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);padding:14px 16px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}
button.send{height:54px;padding:0 19px;border:0;border-radius:15px;background:var(--accent);color:#10150f;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#error{min-height:22px;padding-top:8px;color:#ff9d9d;font-size:13px;text-align:center}
.drawer{position:fixed;inset:0 0 0 auto;width:min(330px,88vw);padding:24px 18px;background:#111722;border-left:1px solid var(--line);box-shadow:-18px 0 50px #0008;transform:translateX(100%);transition:transform .2s;z-index:5}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer h2{margin:0;font-size:18px}.chat-item{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer}.chat-item:hover{border-color:var(--accent)}.new-chat{width:100%;padding:11px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
@media(max-width:520px){main{padding-top:34px}.message{max-width:96%}.composer{gap:7px}button.send{padding:0 14px}}
</style>
</head>
<body>
<aside class="drawer" id="drawer" aria-label="Previous chats"><div class="drawer-head"><h2>Previous chats</h2><button class="top-button" id="close-chats" type="button">Close</button></div><button class="new-chat" id="new-chat" type="button">+ New chat</button><div id="chat-list"></div></aside>
<main>
  <header><button class="top-button" id="chats" type="button">Chats</button><h1>Ghaith</h1><span style="width:64px"></span></header>
  <select id="mode" class="mode" aria-label="Choose mode"><option value="qwen">Qwen</option><option value="deepseek">DeepSeek</option><option value="agent">Agent</option></select>
  <section id="conversation" aria-live="polite"><div class="empty">What’s on your mind?</div></section>
  <form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Write your prompt..." aria-label="Your prompt"></textarea><button class="send" id="send" type="submit">Send</button></form>
  <div id="error" role="status"></div>
</main>
<script>
(function(){
  var conversation=document.getElementById("conversation"),prompt=document.getElementById("prompt"),send=document.getElementById("send"),error=document.getElementById("error"),mode=document.getElementById("mode"),drawer=document.getElementById("drawer"),chatList=document.getElementById("chat-list");
  var chats=JSON.parse(localStorage.getItem("kanha-chats")||"[]"),currentId=localStorage.getItem("kanha-current")||"";
  function save(){localStorage.setItem("kanha-chats",JSON.stringify(chats));localStorage.setItem("kanha-current",currentId)}
  function current(){return chats.find(function(chat){return chat.id===currentId})}
  function makeChat(){var chat={id:Date.now().toString(36),title:"New chat",mode:"qwen",messages:[]};chats.unshift(chat);currentId=chat.id;save();renderChat();renderList()}
  function ensure(){if(!current() )makeChat();else renderChat()}
  function escapeHtml(text){return String(text).replace(/[&<>\"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}
  function format(text){var safe=escapeHtml(text),parts=safe.split(/```(?:[a-zA-Z0-9_+-]+)?\n?([\s\S]*?)```/g),html="";for(var i=0;i<parts.length;i++){if(i%2===0){html+=parts[i]}else{html+='<div class="code-block"><code>'+parts[i].replace(/^\n|\n$/g,"")+'</code><button class="copy-code" type="button">Copy code</button></div>'}}return html}
  function addMessage(role,text){var empty=conversation.querySelector(".empty");if(empty)empty.remove();var message=document.createElement("div");message.className="message "+(role==="user"?"you":"kanha");if(role==="assistant")message.innerHTML=format(text);else message.textContent=text;conversation.appendChild(message);conversation.scrollTop=conversation.scrollHeight}
  function renderChat(){var chat=current();conversation.innerHTML="";mode.value=chat.mode||"qwen";if(!chat.messages.length)conversation.innerHTML='<div class="empty">What’s on your mind?</div>';chat.messages.forEach(function(item){if(item.role==="assistant"){item.content=cleanReply(item.content);if(item.content.toLowerCase().indexOf("ghaith")!==0)item.content="Ghaith\\n\\n"+item.content}addMessage(item.role,item.content)});save()}
  function renderList(){chatList.innerHTML="";if(!chats.length){chatList.innerHTML='<p style="color:var(--muted)">No previous chats yet.</p>';return}chats.forEach(function(chat){var button=document.createElement("button");button.className="chat-item";button.type="button";button.textContent=chat.title||"Untitled chat";button.onclick=function(){currentId=chat.id;save();renderChat();drawer.classList.remove("open")};chatList.appendChild(button)})}
  function cleanReply(text){var answer=String(text||"").trim(),lower=answer.toLowerCase();if(lower.indexOf("need answer")===0||lower.indexOf("user says")===0||lower.indexOf("we are kanha")===0||lower.indexOf("we are ghaith")===0){var natural=lower.lastIndexOf("natural.");if(natural>=0)answer=answer.slice(natural+9).trim()}return answer}
  async function ask(){var text=prompt.value.trim();var chat=current();if(!text||send.disabled||!chat)return;prompt.value="";error.textContent="";chat.mode=mode.value;if(!chat.messages.length)chat.title=text.slice(0,42);chat.messages.push({role:"user",content:text});save();addMessage("user",text);send.disabled=true;send.textContent="...";try{var response=await fetch("/kanha/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chat.messages,mode:mode.value})});var data=await response.json();if(!response.ok)throw new Error(data.detail||"Kanha could not answer");var answer=cleanReply(data.message);if(answer.toLowerCase().indexOf("ghaith")!==0)answer="Ghaith\\n\\n"+answer;chat.messages.push({role:"assistant",content:answer});save();addMessage("assistant",answer)}catch(err){chat.messages.pop();save();error.textContent=err.message}finally{send.disabled=false;send.textContent="Send";prompt.focus()}}
  conversation.addEventListener("click",function(event){if(!event.target.classList.contains("copy-code"))return;var code=event.target.parentElement.querySelector("code").textContent;navigator.clipboard.writeText(code).then(function(){event.target.textContent="Copied";setTimeout(function(){event.target.textContent="Copy code"},1200)}).catch(function(){event.target.textContent="Copy failed"})});
  document.getElementById("composer").addEventListener("submit",function(event){event.preventDefault();ask()});prompt.addEventListener("keydown",function(event){if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){event.preventDefault();ask()}});document.getElementById("chats").onclick=function(){renderList();drawer.classList.add("open")};document.getElementById("close-chats").onclick=function(){drawer.classList.remove("open")};document.getElementById("new-chat").onclick=function(){makeChat();drawer.classList.remove("open")};mode.onchange=function(){var chat=current();if(chat){chat.mode=mode.value;save()}};ensure();
})();
</script>
</body>
</html>
