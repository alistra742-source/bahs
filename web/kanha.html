<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghaith</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#151a24;--line:#283142;--text:#eef2f8;--muted:#8995aa;--accent:#9fe870}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% -20%,#263b36 0%,transparent 65%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}
main{width:min(760px,100%);min-height:100vh;margin:auto;padding:clamp(28px,8vh,86px) 18px 24px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{flex:1;margin:0 0 18px;font-size:clamp(32px,7vw,58px);font-weight:600;letter-spacing:-.06em;text-align:center}
.top-button{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}.top-button:hover{border-color:var(--accent)}
.mode{display:block;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px;font:inherit;outline:none}.browser-panel{margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#101620}.browser-row{display:flex;gap:8px;align-items:center}.browser-url{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px;font:inherit}.browser-frame{display:none;width:100%;height:240px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#080b10;object-fit:contain}.browser-frame.open{display:block}.browser-help{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.4}.attach-row{display:flex;gap:8px;align-items:center;margin-top:8px}.attach-button{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}.attachment{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}.download-file{display:inline-block;margin-top:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-size:12px;text-decoration:none}.download-file:hover{border-color:var(--accent)}
#conversation{flex:1;display:flex;flex-direction:column;gap:16px;padding:12px 0 28px;overflow:auto}.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center}
.message{max-width:92%;padding:13px 16px;border:1px solid var(--line);border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.message.you{align-self:flex-end;background:#1d2c3e;border-color:#36516d}.message.kanha{align-self:flex-start;background:var(--panel)}
.code-block{margin:10px 0 0;border:1px solid #39465a;border-radius:11px;overflow:hidden;background:#0b0f16}.code-block code{display:block;padding:13px;overflow:auto;white-space:pre;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.copy-code{display:block;width:100%;padding:8px 12px;border:0;border-top:1px solid #39465a;background:#1d2634;color:var(--text);font:12px inherit;text-align:right;cursor:pointer}.copy-code:hover{color:var(--accent)}
.composer{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--bg) 18%)}textarea{flex:1;min-height:54px;max-height:180px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);padding:14px 16px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}
button.send{height:54px;padding:0 19px;border:0;border-radius:15px;background:var(--accent);color:#10150f;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#error{min-height:22px;padding-top:8px;color:#ff9d9d;font-size:13px;text-align:center}
.drawer{position:fixed;inset:0 0 0 auto;width:min(330px,88vw);padding:24px 18px;background:#111722;border-left:1px solid var(--line);box-shadow:-18px 0 50px #0008;transform:translateX(100%);transition:transform .2s;z-index:5}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer h2{margin:0;font-size:18px}.chat-item{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer}.chat-item:hover{border-color:var(--accent)}.new-chat{width:100%;padding:11px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
@media(max-width:520px){main{padding-top:34px}.message{max-width:96%}.composer{gap:7px}button.send{padding:0 14px}}
</style>
</head>
<body>
<aside class="drawer" id="drawer" aria-label="Previous chats"><div class="drawer-head"><h2>Previous chats</h2><button class="top-button" id="close-chats" type="button">Close</button></div><button class="new-chat" id="new-chat" type="button">+ New chat</button><div id="chat-list"></div></aside>
<main>
  <header><button class="top-button" id="chats" type="button">Chats</button><h1>Ghaith</h1><span style="width:64px"></span></header>
  <select id="mode" class="mode" aria-label="Choose mode"><option value="qwen">Qwen</option><option value="deepseek">DeepSeek</option><option value="agent">Agent</option></select>
  <section class="browser-panel" aria-label="Live browser"><div class="browser-row"><button class="attach-button" id="browser-start" type="button">Start browser</button><input class="browser-url" id="browser-url" placeholder="https://example.com" inputmode="url"><button class="attach-button" id="browser-shot" type="button" disabled>Send photo</button></div><img class="browser-frame" id="browser-frame" alt="Live browser screenshot"><p class="browser-help">Commands: %Start%, %Start(url)%, %Enter(url)%, %Click(selector)%, %Sels%, %Ss%, %Status%, %Stop%. The AI can write these itself and they run on the live panel; only approved browser actions run, no arbitrary JavaScript or shell commands.</p></section>
  <section id="conversation" aria-live="polite"><div class="empty">What’s on your mind?</div></section>
  <form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Write your prompt..." aria-label="Your prompt"></textarea><button class="send" id="send" type="submit">Send</button></form><div class="attach-row"><label class="attach-button" for="file-input">Attach file/photo</label><input id="file-input" type="file" accept="image/*,.txt,.md,.csv,.pdf,.json,.js,.py,.lua,.luau,.html,.css" multiple hidden><div id="attachments"></div></div>
  <div id="error" role="status"></div>
</main>
<script>
(function(){
  var conversation=document.getElementById("conversation"),prompt=document.getElementById("prompt"),send=document.getElementById("send"),error=document.getElementById("error"),mode=document.getElementById("mode"),drawer=document.getElementById("drawer"),chatList=document.getElementById("chat-list"),fileInput=document.getElementById("file-input"),attachmentBox=document.getElementById("attachments"),browserSession="",browserFrame=document.getElementById("browser-frame"),browserUrl=document.getElementById("browser-url"),browserStart=document.getElementById("browser-start"),browserShot=document.getElementById("browser-shot");
  var pendingFiles=[];
  var chats=JSON.parse(localStorage.getItem("kanha-chats")||"[]"),currentId=localStorage.getItem("kanha-current")||"";
  function save(){localStorage.setItem("kanha-chats",JSON.stringify(chats));localStorage.setItem("kanha-current",currentId)}
  function current(){return chats.find(function(chat){return chat.id===currentId})}
  function makeChat(){var chat={id:Date.now().toString(36),title:"New chat",mode:"qwen",messages:[]};chats.unshift(chat);currentId=chat.id;save();renderChat();renderList()}
  function ensure(){if(!current() )makeChat();else renderChat()}
  function escapeHtml(text){return String(text).replace(/[&<>\"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}
  function format(text){var safe=escapeHtml(text),parts=safe.split(/```(?:[a-zA-Z0-9_+-]+)?\n?([\s\S]*?)```/g),html="";for(var i=0;i<parts.length;i++){if(i%2===0){html+=parts[i]}else{html+='<div class="code-block"><code>'+parts[i].replace(/^\n|\n$/g,"")+'</code><button class="copy-code" type="button">Copy code</button></div>'}}return html}
  function addMessage(role,text,files){var empty=conversation.querySelector(".empty");if(empty)empty.remove();var message=document.createElement("div");message.className="message "+(role==="user"?"you":"kanha");if(role==="assistant")message.innerHTML=format(text);else message.textContent=text;if(files&&files.length){files.forEach(function(file){var link=document.createElement("a");link.className="download-file";link.href=file.url||("/attach/"+file.id);link.download=file.name;link.textContent="Download "+file.name;message.appendChild(document.createElement("br"));message.appendChild(link)})}conversation.appendChild(message);conversation.scrollTop=conversation.scrollHeight}
  function renderChat(){var chat=current();conversation.innerHTML="";mode.value=chat.mode||"qwen";if(!chat.messages.length)conversation.innerHTML='<div class="empty">What’s on your mind?</div>';chat.messages.forEach(function(item){if(item.role==="assistant")item.content=cleanReply(item.content);addMessage(item.role,item.content)});save()}
  function renderList(){chatList.innerHTML="";if(!chats.length){chatList.innerHTML='<p style="color:var(--muted)">No previous chats yet.</p>';return}chats.forEach(function(chat){var button=document.createElement("button");button.className="chat-item";button.type="button";button.textContent=chat.title||"Untitled chat";button.onclick=function(){currentId=chat.id;save();renderChat();drawer.classList.remove("open")};chatList.appendChild(button)})}
  function cleanReply(text){var answer=String(text||"").trim(),lower=answer.toLowerCase();if(lower.indexOf("need answer")===0||lower.indexOf("user says")===0||lower.indexOf("we are kanha")===0||lower.indexOf("we are ghaith")===0){var natural=lower.lastIndexOf("natural.");if(natural>=0)answer=answer.slice(natural+9).trim()}return answer}
  async function ask(){var text=prompt.value.trim();var chat=current();if(!text&&!pendingFiles.length||send.disabled||!chat)return;prompt.value="";error.textContent="";chat.mode=mode.value;if(!chat.messages.length)chat.title=text.slice(0,42)||"Photo chat";var uploaded=[];try{for(var i=0;i<pendingFiles.length;i++){var file=pendingFiles[i];if(file.id){uploaded.push(file.id);continue}var data=await readFile(file);var upload=await fetch("/api/kanha/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:file.name,mime:file.type,data:data})});var kept=await upload.json();if(!upload.ok)throw new Error(kept.detail||"Could not upload "+file.name);uploaded.push(kept.id)}chat.messages.push({role:"user",content:text||"Please inspect the attached file(s).",files:uploaded});save();addMessage("user",text||"Attached file(s): "+pendingFiles.map(function(f){return f.name}).join(", "));pendingFiles=[];renderAttachments();send.disabled=true;send.textContent="...";var response=await fetch("/api/kanha/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chat.messages,mode:mode.value,files:uploaded})});var data=await response.json();if(!response.ok)throw new Error(data.detail||"Kanha could not answer");var answer=cleanReply(data.message);chat.messages.push({role:"assistant",content:answer,files:data.files||[]});save();addMessage("assistant",answer,data.files||[]);runCommands(answer)}catch(err){if(chat.messages.length&&chat.messages[chat.messages.length-1].role==="user")chat.messages.pop();save();error.textContent=err.message}finally{send.disabled=false;send.textContent="Send";prompt.focus()}}
  function readFile(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(",").pop())};reader.onerror=reject;reader.readAsDataURL(file)})}
  function renderAttachments(){attachmentBox.innerHTML="";pendingFiles.forEach(function(file,index){var item=document.createElement("span");item.className="attachment";item.textContent=file.name+" ";var remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.onclick=function(){pendingFiles.splice(index,1);renderAttachments()};item.appendChild(remove);attachmentBox.appendChild(item)})}
  fileInput.onchange=function(){pendingFiles=Array.prototype.slice.call(fileInput.files||[]).slice(0,5);renderAttachments();fileInput.value=""};
  function runCommands(text){var found=String(text||"").match(/%[A-Za-z]+(?:\([^)]*\))?%/g)||[];found.forEach(function(cmd){browserCommand(cmd).then(function(res){if(res&&res.selectors){var lines=res.selectors.map(function(s){return s.label?s.label+"  ->  "+s.selector:s.selector});addMessage("assistant","[Ghaith] browser "+cmd+"\n"+res.url+"\n\n"+lines.join("\n"))}}).catch(function(e){error.textContent=cmd+" failed: "+e.message})})}

  async function browserCommand(command){var body={command:command,session:browserSession,url:browserUrl.value.trim()};var response=await fetch("/api/kanha/browser",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});var data=await response.json();if(!response.ok)throw new Error(data.detail||"Browser command failed");if(data.session)browserSession=data.session;if(data.url)browserUrl.value=data.url;if(data.attachment){pendingFiles.push({name:data.attachment.name,type:data.attachment.mime,id:data.attachment.id});renderAttachments();if(!data.data){browserCommand("%Status%").catch(function(){})}}if(data.data){browserFrame.src="data:image/png;base64,"+data.data;browserFrame.classList.add("open")}browserShot.disabled=!browserSession;return data}
  browserStart.onclick=function(){browserCommand(browserUrl.value.trim()?"%Start("+browserUrl.value.trim()+")%":"%Start%").catch(function(e){error.textContent=e.message})};browserShot.onclick=function(){browserCommand("%Ss%").catch(function(e){error.textContent=e.message})};
  conversation.addEventListener("click",function(event){if(!event.target.classList.contains("copy-code"))return;var code=event.target.parentElement.querySelector("code").textContent;navigator.clipboard.writeText(code).then(function(){event.target.textContent="Copied";setTimeout(function(){event.target.textContent="Copy code"},1200)}).catch(function(){event.target.textContent="Copy failed"})});
  document.getElementById("composer").addEventListener("submit",function(event){event.preventDefault();ask()});prompt.addEventListener("keydown",function(event){if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){event.preventDefault();ask()}});document.getElementById("chats").onclick=function(){renderList();drawer.classList.add("open")};document.getElementById("close-chats").onclick=function(){drawer.classList.remove("open")};document.getElementById("new-chat").onclick=function(){makeChat();drawer.classList.remove("open")};mode.onchange=function(){var chat=current();if(chat){chat.mode=mode.value;save()}};ensure();
})();
</script>
</body>
</html>
